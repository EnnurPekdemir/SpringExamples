server:
  port: 8080

spring:
  application:
    name: spring-boot-flyway
  datasource:
    url: jdbc:postgresql://localhost:5432/flyway_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
