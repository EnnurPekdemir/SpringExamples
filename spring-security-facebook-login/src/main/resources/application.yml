server:
  port: 8080

spring:
  application:
    name: spring-security-facebook-login
  security:
    oauth2:
      client:
        registration:
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID:YOUR_FACEBOOK_APP_ID}
            client-secret: ${FACEBOOK_CLIENT_SECRET:YOUR_FACEBOOK_APP_SECRET}
            scope:
              - email
              - public_profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
