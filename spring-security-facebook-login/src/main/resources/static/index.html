<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Security - Facebook OAuth2 Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1877f2 0%, #0d47a1 100%);
            color: #333;
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 420px;
            width: 90%;
        }
        .card h1 {
            font-size: 24px;
            color: #1a1a1a;
            margin-bottom: 12px;
        }
        .card p {
            font-size: 14px;
            color: #666;
            margin-bottom: 28px;
            line-height: 1.5;
        }
        .btn-facebook {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background-color: #1877f2;
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            padding: 14px 24px;
            border-radius: 8px;
            transition: background-color 0.2s ease, transform 0.1s ease;
            width: 100%;
        }
        .btn-facebook:hover {
            background-color: #1464cc;
            transform: translateY(-2px);
        }
        .btn-facebook svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Facebook OAuth2 Login</h1>
        <p>Spring Boot & Spring Security 6 ile Facebook OAuth 2.0 kimlik doğrulama örneği.</p>
        <a class="btn-facebook" href="/oauth2/authorization/facebook">
            <svg viewBox="0 0 24 24">
                <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
            </svg>
            Facebook ile Giriş Yap
        </a>
    </div>
</body>
</html>
