<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Chat Tester</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--danger);
            box-shadow: 0 0 8px var(--danger);
            transition: all 0.3s ease;
        }

        .status-dot.connected {
            background-color: var(--success);
            box-shadow: 0 0 8px var(--success);
        }

        .settings-bar {
            padding: 15px 20px;
            background: rgba(15, 23, 42, 0.6);
            display: flex;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .input-group {
            display: flex;
            flex: 1;
            gap: 8px;
        }

        input {
            width: 100%;
            padding: 10px 14px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn-connect {
            background: var(--success);
            color: #fff;
        }

        .btn-disconnect {
            background: var(--danger);
            color: #fff;
        }

        .btn-send {
            background: var(--primary);
            color: #fff;
        }

        button:hover:not(:disabled) {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .chat-box {
            height: 380px;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            background: #0f172a;
            border-left: 4px solid var(--primary);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            animation: fadeIn 0.3s ease;
        }

        .message.system {
            border-left-color: var(--text-muted);
            color: var(--text-muted);
            font-style: italic;
            font-size: 0.85rem;
        }

        .message-sender {
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 4px;
            font-size: 0.85rem;
        }

        .message-text {
            word-break: break-word;
        }

        .footer {
            padding: 15px 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>WebSocket Chat Tester</h1>
        <div class="status-badge">
            <span id="status-dot" class="status-dot"></span>
            <span id="status-text">Bağlı Değil</span>
        </div>
    </div>

    <div class="settings-bar">
        <input type="text" id="ws-url" value="http://localhost:8080/chat" placeholder="WebSocket URL">
        <button id="btn-connect" class="btn-connect" onclick="connect()">Bağlan</button>
        <button id="btn-disconnect" class="btn-disconnect" onclick="disconnect()" disabled>Bağlantıyı Kes</button>
    </div>

    <div class="chat-box" id="chat-box">
        <div class="message system">WebSocket sunucusuna bağlanmak için "Bağlan" butonuna tıklayın.</div>
    </div>

    <div class="footer">
        <input type="text" id="sender-input" placeholder="Adınız" style="width: 30%;" value="User1">
        <input type="text" id="message-input" placeholder="Mesajınızı yazın..." disabled onkeydown="if(event.key==='Enter') sendMessage()">
        <button id="btn-send" class="btn-send" onclick="sendMessage()" disabled>Gönder</button>
    </div>
</div>

<script>
    let stompClient = null;

    function setConnected(connected) {
        document.getElementById('btn-connect').disabled = connected;
        document.getElementById('btn-disconnect').disabled = !connected;
        document.getElementById('message-input').disabled = !connected;
        document.getElementById('btn-send').disabled = !connected;
        
        const dot = document.getElementById('status-dot');
        const text = document.getElementById('status-text');

        if (connected) {
            dot.classList.add('connected');
            text.innerText = 'Bağlandı';
        } else {
            dot.classList.remove('connected');
            text.innerText = 'Bağlı Değil';
        }
    }

    function connect() {
        const url = document.getElementById('ws-url').value;
        addSystemMessage("Sunucuya bağlanılıyor: " + url);

        const socket = new SockJS(url);
        stompClient = Stomp.over(socket);

        // STOMP debug loglarını opsiyonel olarak kapatabilir veya konsolda tutabiliriz
        stompClient.debug = function(str) {
            console.log(str);
        };

        stompClient.connect({}, function (frame) {
            setConnected(true);
            addSystemMessage("Bağlantı başarılı: " + frame);

            stompClient.subscribe('/topic', function (messageOutput) {
                const message = JSON.parse(messageOutput.body);
                showMessage(message.sender, message.message);
            });
        }, function (error) {
            setConnected(false);
            addSystemMessage("Bağlantı hatası: " + error);
        });
    }

    function disconnect() {
        if (stompClient !== null) {
            stompClient.disconnect();
        }
        setConnected(false);
        addSystemMessage("Bağlantı kapatıldı.");
    }

    function sendMessage() {
        const sender = document.getElementById('sender-input').value.trim() || 'Anonim';
        const messageInput = document.getElementById('message-input');
        const message = messageInput.value.trim();

        if (message && stompClient) {
            const payload = JSON.stringify({
                'sender': sender,
                'message': message
            });
            stompClient.send("/app/chat", {}, payload);
            messageInput.value = '';
            messageInput.focus();
        }
    }

    function showMessage(sender, message) {
        const chatBox = document.getElementById('chat-box');
        const msgElement = document.createElement('div');
        msgElement.className = 'message';
        
        const senderElement = document.createElement('div');
        senderElement.className = 'message-sender';
        senderElement.textContent = sender;

        const textElement = document.createElement('div');
        textElement.className = 'message-text';
        textElement.textContent = message;

        msgElement.appendChild(senderElement);
        msgElement.appendChild(textElement);
        chatBox.appendChild(msgElement);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function addSystemMessage(text) {
        const chatBox = document.getElementById('chat-box');
        const msgElement = document.createElement('div');
        msgElement.className = 'message system';
        msgElement.textContent = text;
        chatBox.appendChild(msgElement);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
